services:
  sampatti:
    build: .
    container_name: sampatti
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - BASE_URL=${BASE_URL:-https://sampatti.example.com}
      - OAUTH_SECRET=${OAUTH_SECRET:-}
    volumes:
      - shm:/dev/shm
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/.well-known/oauth-authorization-server"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m

networks:
  shared:
    external: true
