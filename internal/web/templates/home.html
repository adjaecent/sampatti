<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampatti Authentication</title>
    <link rel="stylesheet" href="/static/css/picnic.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { max-width: 500px; margin: 2em; }
        .platform { margin-bottom: 1.5em; padding: 1.5em; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <header>
            <h1>🔐 Sampatti</h1>
            <p>Secure Investment Data Access</p>
        </header>
        
        <form method="post">
            <div class="platform">
                <h3>🏛️ Kuvera (Indian Mutual Funds)</h3>
                <label for="kuvera_username">Email/Username</label>
                <input type="text" id="kuvera_username" name="kuvera_username" placeholder="your-email@example.com">
                
                <label for="kuvera_password">Password</label>
                <input type="password" id="kuvera_password" name="kuvera_password">
            </div>

            <div class="platform">
                <h3>📈 Stockal (US Stocks)</h3>
                <label for="stockal_username">Email/Username</label>
                <input type="text" id="stockal_username" name="stockal_username" placeholder="your-email@example.com">
                
                <label for="stockal_password">Password</label>
                <input type="password" id="stockal_password" name="stockal_password">
            </div>

            <p style="text-align: center; color: #666; font-size: 0.9em; margin: 1em 0;">
                💡 You can configure just one platform or both
            </p>
            
            <button type="submit" class="button">🔐 Authorize Credentials</button>
        </form>
        
        <footer style="text-align: center; color: #666; font-size: 0.8em;">
            🛡️ Your credentials are encrypted and stored temporarily in memory only
        </footer>
    </div>
</body>
</html>
