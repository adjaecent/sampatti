{{define "base"}}
<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{template "title" .}}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.4.2/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'Geist', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-base-100">
    {{template "navbar" .}}

    <main class="container mx-auto px-4 py-8">
      {{template "content" .}}
    </main>

    {{template "footer" .}}
    
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
{{end}}

{{define "navbar"}}
<div class="navbar bg-primary text-primary-content shadow-lg">
  <div class="navbar-start">
    <a href="/dashboard" class="btn btn-ghost text-xl font-bold">
      <i data-lucide="trending-up" class="w-5 h-5 mr-2"></i>
      Sampatti
    </a>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      <li>
        <a href="/dashboard" class="hover:bg-primary-focus">
          <i data-lucide="gauge" class="w-4 h-4 mr-2"></i>
          Dashboard
        </a>
      </li>
      <li>
        <a href="/accounts" class="hover:bg-primary-focus">
          <i data-lucide="settings" class="w-4 h-4 mr-2"></i>
          Accounts
        </a>
      </li>
    </ul>
  </div>
  <div class="navbar-end">
    <form method="POST" action="/logout" class="inline">
      <button type="submit" class="btn btn-ghost hover:bg-primary-focus">
        <i data-lucide="log-out" class="w-4 h-4 mr-2"></i>
        Logout
      </button>
    </form>
  </div>
</div>
{{end}}

{{define "footer"}}
<footer class="footer footer-center p-4 bg-base-300 text-base-content mt-auto">
  <div>
    <p class="font-semibold">Sampatti Investment Dashboard</p>
    <p class="text-sm opacity-70">
      Consolidate your Kuvera and Stockal investments
    </p>
  </div>
</footer>
{{end}}
