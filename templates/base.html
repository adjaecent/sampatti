<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{block "title" .}}Sampatti - Investment Dashboard{{end}}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.4.2/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-base-100">
    {{block "navbar" .}}
    <div class="navbar bg-primary text-primary-content shadow-lg">
      <div class="navbar-start">
        <a href="/dashboard" class="btn btn-ghost text-xl font-bold">
          <i class="fas fa-chart-line mr-2"></i>
          Sampatti
        </a>
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li>
            <a href="/dashboard" class="hover:bg-primary-focus">
              <i class="fas fa-tachometer-alt mr-2"></i>
              Dashboard
            </a>
          </li>
          <li>
            <a href="/accounts" class="hover:bg-primary-focus">
              <i class="fas fa-user-cog mr-2"></i>
              Accounts
            </a>
          </li>
        </ul>
      </div>
      <div class="navbar-end">
        <form method="POST" action="/logout" class="inline">
          <button type="submit" class="btn btn-ghost hover:bg-primary-focus">
            <i class="fas fa-sign-out-alt mr-2"></i>
            Logout
          </button>
        </form>
      </div>
    </div>
    {{end}}

    <main class="container mx-auto px-4 py-8">
      {{block "content" .}}{{end}}
    </main>

    {{block "footer" .}}
    <footer
      class="footer footer-center p-4 bg-base-300 text-base-content mt-auto"
    >
      <div>
        <p class="font-semibold">Sampatti Investment Dashboard</p>
        <p class="text-sm opacity-70">
          Consolidate your Kuvera and Stockal investments
        </p>
      </div>
    </footer>
    {{end}}
  </body>
</html>
