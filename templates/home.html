<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sampatti - Investment Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.4.2/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-primary to-secondary">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="max-w-md w-full">
        <div class="card bg-base-100 shadow-2xl">
          <div class="card-body text-center items-center">
            <div class="mb-6">
              <i
                data-lucide="trending-up"
                class="w-16 h-16 text-primary mb-4 mx-auto"
              ></i>
              <h1 class="text-4xl font-bold text-primary mb-2">Sampatti</h1>
              <p class="text-lg text-base-content opacity-70">
                One Investment Dashboard For Families
              </p>
            </div>

            <div class="divider">Connect</div>

            <div class="space-y-4 mb-6">
              <div
                class="flex flex-wrap items-center justify-center space-x-2 gap-y-2 text-sm"
              >
                <div class="badge badge-outline">
                  <i data-lucide="building" class="w-4 h-4 mr-1"></i>
                  Kuvera
                </div>
                <div class="badge badge-outline">
                  <i data-lucide="bar-chart" class="w-4 h-4 mr-1"></i>
                  Stockal
                </div>
                <div class="badge badge-outline">
                  <i data-lucide="circle-chevron-left" class="w-4 h-4 mr-1"></i>
                  Kite Connect
                </div>
                <div class="badge badge-outline">
                  <i data-lucide="landmark" class="w-4 h-4 mr-1"></i>
                  HDFC Bank
                </div>
                <div class="badge badge-outline">
                  <i data-lucide="coins" class="w-4 h-4 mr-1"></i>
                  Gold/Silver
                </div>
              </div>

              <p class="text-base-content opacity-60 text-sm">
                Consolidate your portfolio data from multiple platforms in one
                secure dashboard
              </p>
            </div>

            <a href="/auth/google" class="btn btn-primary btn-wide gap-2">
              <i data-lucide="chrome" class="w-5 h-5"></i>
              Sign in with Google
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
